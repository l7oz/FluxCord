name: Build & Release
on:
    push:
        branches:
            - main
        tags:
            - "v*"
    workflow_dispatch:

env:
    FORCE_COLOR: true

permissions:
    contents: write

jobs:
    Build:
        name: Build FluxCord
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
              with:
                  # tags are force-moved for releases; full history keeps the banner hash correct
                  fetch-depth: 0

            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck
              run: pnpm testTsc

            - name: Build standalone
              run: pnpm buildStandalone

            - name: Verify banner hash matches the built commit
              run: |
                  built=$(grep -o 'FluxCord [0-9a-f]\{40\}' dist/equibop/renderer.js | head -n 1 | cut -d' ' -f2)
                  head=$(git rev-parse HEAD)
                  echo "banner: $built"
                  echo "head:   $head"
                  test "$built" = "$head"

            - name: Generate plugin lists
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateEquicordPluginJson dist/equicordplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateDevsList dist/devs.json

            # Tag pushes (e.g. git tag -f v1.0.1 <sha> && git push -f origin v1.0.1)
            # build desktop.asar from that exact commit and attach it to the
            # tag's release. Title/notes stay manual (gh release edit).
            - name: Upload desktop.asar to tag release
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  if ! gh release view "$tag" >/dev/null 2>&1; then
                    gh release create "$tag" --title "$tag" --notes "FluxCord $tag" --target "${{ github.sha }}"
                  fi
                  gh release upload "$tag" --clobber dist/desktop.asar

            # Keep Flux-bored metadata in sync on main pushes.
            # Needs a repo-scoped PAT stored as FLUX_BORED_TOKEN; skipped silently without it.
            - name: Sync plugin JSONs to Flux-bored
              if: github.ref == 'refs/heads/main'
              env:
                  SYNC_TOKEN: ${{ secrets.FLUX_BORED_TOKEN }}
              run: |
                  if [ -z "$SYNC_TOKEN" ]; then
                    echo "FLUX_BORED_TOKEN not set; skipping Flux-bored sync"
                    exit 0
                  fi
                  git config --global user.name "GitHub-Actions"
                  git config --global user.email actions@github.com
                  git clone "https://x-access-token:$SYNC_TOKEN@github.com/l7oz/Flux-bored.git" fluxbored
                  cd fluxbored
                  cp ../dist/plugins.json ../dist/equicordplugins.json ../dist/vencordplugins.json ../dist/devs.json .
                  git add -A
                  git commit -m "Plugins for https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" || exit 0
                  git push origin main
